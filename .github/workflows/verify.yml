name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: node scripts/install-ci.mjs
      - run: npm run build && npm test
        working-directory: server
      - run: docker build -t heart-adoption .
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: node scripts/install-ci.mjs
      - name: Start the isolated API for native integration tests
        run: |
          cd server
          npm run dev -- --local > /tmp/heart-adoption-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/heart-adoption-api.log
          exit 1
      - name: Build and test on the available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -quiet -project HeartAdoption.xcodeproj -scheme HeartAdoption -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO test
